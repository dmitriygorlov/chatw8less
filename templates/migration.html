<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ChatW8Less переехал</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #163d35;
      background: #eef3ec;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(51, 130, 111, 0.18), transparent 42%),
        #eef3ec;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 52px);
      text-align: center;
      background: #fffaf5;
      border: 1px solid rgba(22, 61, 53, 0.16);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(22, 61, 53, 0.13);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #247765;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #153a32;
      font-size: clamp(2rem, 8vw, 3.2rem);
      line-height: 1.05;
    }
    .lead {
      margin: 22px 0 0;
      color: #435f58;
      font-size: clamp(1rem, 4vw, 1.18rem);
      line-height: 1.6;
    }
    .button {
      display: block;
      margin-top: 30px;
      padding: 17px 24px;
      color: white;
      background: #247765;
      border-radius: 16px;
      font-size: 1.08rem;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(36, 119, 101, 0.24);
      transition: transform 150ms ease, background 150ms ease;
    }
    .button:hover {
      background: #1c6556;
      transform: translateY(-1px);
    }
    .button:focus-visible {
      outline: 4px solid rgba(36, 119, 101, 0.25);
      outline-offset: 4px;
    }
    .note {
      margin: 20px 0 0;
      color: #688078;
      font-size: 0.92rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main data-migration-page>
    <p class="eyebrow">Новый адрес</p>
    <h1>ChatW8Less переехал</h1>
    <p class="lead">
      Все данные и история уже на новом сайте. Нажмите кнопку, чтобы продолжить.
    </p>
    <a class="button" href="{{ target_url }}">Открыть ChatW8Less</a>
    <p class="note">
      На новом сайте потребуется один раз войти своей прежней кодовой фразой.
    </p>
  </main>
</body>
</html>
